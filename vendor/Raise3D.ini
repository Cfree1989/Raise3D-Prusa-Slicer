# Raise3D Pro2 Plus Hyper Speed - experimental PrusaSlicer vendor bundle
# NOT production-ready. 0.4 mm / PLA. Dual printer (T0+T1); unused tools skipped via is_extruder_used.
# Start/end G-code derived from ideaMaker 5.4.2.8790 (conradfreeman_filament_orange.gcode), T1 gated.
# Community 2022 Marlin Pro2 bundles are not the source of start/end G-code.

[vendor]
repo_id = non-prusa-fff
name = Raise3D (experimental)
config_version = 0.3.1

[printer_model:PRO2PLUS_HS_DUAL]
name = Raise3D Pro2 Plus Hyper Speed Dual (experimental)
variants = 0.4
technology = FFF
family = Pro2
default_materials = PLA @Raise3D Pro2 Plus HS

[printer:*common*]
printer_technology = FFF
autoemit_temperature_commands = 0
before_layer_gcode = ;LAYER:{layer_num}\n;Z:{layer_z}
between_objects_gcode =
color_change_gcode =
cooling_tube_length = 5
cooling_tube_retraction = 91.5
default_filament_profile = "PLA @Raise3D Pro2 Plus HS"
default_print_profile = 0.20mm SPEED @Raise3D Pro2 Plus HS
deretract_speed = 40
extruder_colour = #FF8000
extruder_offset = 0x0
extruder_clearance_height = 25
extruder_clearance_radius = 45
gcode_flavor = klipper
host_type = octoprint
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 5000,2000
machine_max_acceleration_retracting = 5000,2000
machine_max_acceleration_travel = 5000,2000
machine_max_acceleration_x = 5000,2000
machine_max_acceleration_y = 5000,2000
machine_max_acceleration_z = 200,200
machine_max_feedrate_e = 40,40
machine_max_feedrate_x = 150,150
machine_max_feedrate_y = 150,150
machine_max_feedrate_z = 12,12
machine_max_jerk_e = 5,5
machine_max_jerk_x = 10,10
machine_max_jerk_y = 10,10
machine_max_jerk_z = 0.4,0.4
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
max_layer_height = 0.32
min_layer_height = 0.08
nozzle_diameter = 0.4
pause_print_gcode = M2000
remaining_times = 0
retract_before_travel = 1
retract_before_wipe = 0%
retract_layer_change = 1
retract_length = 1.5
retract_length_toolchange = 1.5
retract_lift = 0
retract_lift_above = 0
retract_lift_below = 0
retract_restart_extra = 0
retract_restart_extra_toolchange = 0
retract_speed = 40
silent_mode = 0
single_extruder_multi_material = 0
thumbnails = 32x32/PNG, 400x300/PNG
thumbnails_format = PNG
toolchange_gcode =
use_firmware_retraction = 0
use_relative_e_distances = 0
use_volumetric_e = 0
variable_layer_height = 1
wipe = 1
z_offset = 0

[printer:Raise3D Pro2 Plus Hyper Speed 0.4 Dual]
inherits = *common*
printer_model = PRO2PLUS_HS_DUAL
printer_variant = 0.4
bed_shape = 0x0,305x0,305x305,0x305
max_print_height = 605
nozzle_diameter = 0.4,0.4
extruder_colour = #FF8000;#00B0E0
extruder_offset = 0x0,0x0
max_layer_height = 0.32,0.32
min_layer_height = 0.08,0.08
deretract_speed = 40,40
retract_before_travel = 1,1
retract_before_wipe = 0%,0%
retract_layer_change = 1,1
retract_length = 1.5,1.5
retract_length_toolchange = 2,2
retract_lift = 0,0
retract_lift_above = 0,0
retract_lift_below = 0,0
retract_restart_extra = 0,0
retract_restart_extra_toolchange = 0,0
retract_speed = 40,40
wipe = 1,1
default_filament_profile = "PLA @Raise3D Pro2 Plus HS";"PLA @Raise3D Pro2 Plus HS"
default_print_profile = 0.20mm SPEED @Raise3D Pro2 Plus HS
printer_notes = Don't remove the following keywords! These keywords are used in the compatible printer condition of the print and filament profiles.\nPRINTER_VENDOR_RAISE3D\nPRINTER_MODEL_PRO2PLUS_HS\nPRINTER_VARIANT_DUAL\nEXPERIMENTAL\nNot production-ready. Hyper Speed / Klipper Pro2 Plus dual electronic-lift heads.\nLeft start/end from ideaMaker 5.4.2.8790 conradfreeman_filament_orange.gcode. Dual heat/purge/tool-change is gated with is_extruder_used. XY nozzle offset is firmware (factory 25 mm X) — slicer offset is 0 so it is not applied twice. No ideaMaker dual file yet; Stage 6-7 physical tests required.
start_gcode = M99123 \n; EXPERIMENTAL PrusaSlicer dual profile - not production-ready\n; Left sequence from ideaMaker 5.4.2.8790; T1 gated by is_extruder_used\n;Dimension: 305.000 305.000 605.000 0.400 0.400\n;Plate Shape: 0\n;Origin Center: 0\n;Extruder Offset #1: 0.000 0.000\n;Extruder Offset #2: 0.000 0.000\n;Printer Type: RAISE3D Pro2 Plus - Hyper Speed\n;Firmware: Klipper\n;Filament Diameter #1: {filament_diameter[0]}\n;Filament Diameter #2: {filament_diameter[1]}\n;Filament Compensation #1: {extrusion_multiplier[0]*100}\n;Filament Compensation #2: {extrusion_multiplier[1]*100}\n;Filament Density #1: {filament_density[0]*1000}\n;Filament Density #2: {filament_density[1]*1000}\n;Filament Type #1: {filament_type[0]}\n;Filament Type #2: {filament_type[1]}\n;Filament Name #1: PLA\n;Filament Name #2: PLA\n;Filament #1: PLA 1.75mm\n;Filament #2: PLA 1.75mm\n{if is_extruder_used[0]}M221 T0 S{extrusion_multiplier[0]*100}\nM104 T0 S{first_layer_temperature[0]}\n{endif}\n{if is_extruder_used[1]}M221 T1 S{extrusion_multiplier[1]*100}\nM104 T1 S{first_layer_temperature[1]}\n{endif}\nM140 S{first_layer_bed_temperature[0]}\n{if is_extruder_used[0]}M109 T0 S{first_layer_temperature[0]}\n{endif}\n{if is_extruder_used[1]}M109 T1 S{first_layer_temperature[1]}\n{endif}\nT0\nM190 S{first_layer_bed_temperature[0]}\nG21\nG90\nM82\nM107\nG28 X0 Y0\nG28 Z0\nG1 Z15.0 F300\n{if is_extruder_used[0]}T0\nG92 E0\nG1 F140 E29\nG1 X20 Y0 F140 E30\nG92 E0\n{endif}\n{if is_extruder_used[1]}T1\nG92 E0\nG1 F140 E29\nG1 X40 Y0 F140 E30\nG92 E0\n{endif}\n{if initial_extruder == 0}T0\n{else}T1\n{endif}\nG1 F9000.0\nM117 Printing...\nM1001\nSET_VELOCITY_LIMIT ACCEL=5000.00\nSET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10.00
end_gcode = M221 T0 S100\nM221 T1 S100\nG92 E0\nM1002\nM104 T0 S0\nM104 T1 S0\nM104 S0\nM140 S0\nM107\nG91\nG1 E-1 F300\nG1 Z+0.5 E-5 X-20 Y-20 F9000.00\nG28 X0 Y0\nM84\nG90
toolchange_gcode = ; Raise3D electronic lift: firmware raises the unused nozzle. Do not emit M218.\nM104 T{previous_extruder} S{temperature[previous_extruder]-30}\nM109 T{next_extruder} S{temperature[next_extruder]}

