# Raise3D Pro2 Plus Hyper Speed - experimental PrusaSlicer vendor bundle
# NOT production-ready. Left extruder / 0.4 mm / Overture PLA first pass.
# Machine G-code derived from ideaMaker 5.4.2.8790 (conradfreeman_filament_orange.gcode).
# Community 2022 Marlin Pro2 bundles are not the source of start/end G-code.

[vendor]
repo_id = non-prusa-fff
name = Raise3D (experimental)
config_version = 0.1.0

[printer_model:PRO2PLUS_HS]
name = Raise3D Pro2 Plus Hyper Speed (experimental)
variants = 0.4
technology = FFF
family = Pro2
default_materials = Overture PLA @Raise3D Pro2 Plus HS Left

[printer:*common*]
printer_technology = FFF
autoemit_temperature_commands = 0
before_layer_gcode = ;LAYER:{layer_num}\n;Z:{layer_z}
between_objects_gcode =
color_change_gcode =
cooling_tube_length = 5
cooling_tube_retraction = 91.5
default_filament_profile = "Overture PLA @Raise3D Pro2 Plus HS Left"
default_print_profile = 0.20mm L1 Conservative @Raise3D Pro2 Plus HS Left
deretract_speed = 40
extruder_colour = #FF8000
extruder_offset = 0x0
extruder_clearance_height = 25
extruder_clearance_radius = 45
gcode_flavor = klipper
host_type = octoprint
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 5000,2000
machine_max_acceleration_retracting = 5000,2000
machine_max_acceleration_travel = 5000,2000
machine_max_acceleration_x = 5000,2000
machine_max_acceleration_y = 5000,2000
machine_max_acceleration_z = 200,200
machine_max_feedrate_e = 40,40
machine_max_feedrate_x = 150,150
machine_max_feedrate_y = 150,150
machine_max_feedrate_z = 12,12
machine_max_jerk_e = 5,5
machine_max_jerk_x = 10,10
machine_max_jerk_y = 10,10
machine_max_jerk_z = 0.4,0.4
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
max_layer_height = 0.32
min_layer_height = 0.08
nozzle_diameter = 0.4
pause_print_gcode = M2000
remaining_times = 0
retract_before_travel = 1
retract_before_wipe = 0%
retract_layer_change = 1
retract_length = 1.5
retract_length_toolchange = 1.5
retract_lift = 0
retract_lift_above = 0
retract_lift_below = 0
retract_restart_extra = 0
retract_restart_extra_toolchange = 0
retract_speed = 40
silent_mode = 0
single_extruder_multi_material = 0
thumbnails = 32x32/PNG, 400x300/PNG
thumbnails_format = PNG
toolchange_gcode =
use_firmware_retraction = 0
use_relative_e_distances = 0
use_volumetric_e = 0
variable_layer_height = 1
wipe = 1
z_offset = 0

[printer:Raise3D Pro2 Plus Hyper Speed 0.4 Left]
inherits = *common*
printer_model = PRO2PLUS_HS
printer_variant = 0.4
bed_shape = 0x0,305x0,305x305,0x305
max_print_height = 605
printer_notes = Don't remove the following keywords! These keywords are used in the compatible printer condition of the print and filament profiles.\nPRINTER_VENDOR_RAISE3D\nPRINTER_MODEL_PRO2PLUS_HS\nPRINTER_VARIANT_LEFT\nEXPERIMENTAL\nNot production-ready. Hyper Speed / Klipper Pro2 Plus left extruder only.\nStart/end G-code derived from ideaMaker 5.4.2.8790 file conradfreeman_filament_orange.gcode.
start_gcode = M99123 \n; EXPERIMENTAL PrusaSlicer profile - not production-ready\n; Derived from ideaMaker 5.4.2.8790 conradfreeman_filament_orange.gcode\n;Dimension: 305.000 305.000 605.000 0.400 0.400\n;Plate Shape: 0\n;Origin Center: 0\n;Extruder Offset #1: 0.000 0.000\n;Printer Type: RAISE3D Pro2 Plus - Hyper Speed\n;Firmware: Klipper\n;Filament Diameter #1: {filament_diameter[0]}\n;Filament Compensation #1: {extrusion_multiplier[0]*100}\n;Filament Density #1: {filament_density[0]*1000}\n;Filament Type #1: {filament_type[0]}\n;Filament Name #1: Overture PLA\n;Filament #1: Overture PLA 1.75mm\nM221 T0 S{extrusion_multiplier[0]*100}\nM140 S{first_layer_bed_temperature[0]}\nM104 T0 S{first_layer_temperature[0]}\nM109 T0 S{first_layer_temperature[0]}\nT0\nM190 S{first_layer_bed_temperature[0]}\nG21\nG90\nM82\nM107\nG28 X0 Y0\nG28 Z0\nG1 Z15.0 F300\nG92 E0\nG1 F140 E29\nG1 X20 Y0 F140 E30\nG92 E0\nG1 F9000.0\nM117 Printing...\nM1001\nSET_VELOCITY_LIMIT ACCEL=5000.00\nSET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10.00
end_gcode = M221 T0 S100\nG92 E0\nM1002\nM104 T0 S0\nM221 T0 S100\nM104 S0\nM140 S0\nM107\nG91\nG1 E-1 F300\nG1 Z+0.5 E-5 X-20 Y-20 F9000.00\nG28 X0 Y0\nM84\nG90

[print:*common*]
avoid_crossing_perimeters = 0
bottom_fill_pattern = monotonic
bottom_solid_layers = 4
bottom_solid_min_thickness = 0.8
bridge_acceleration = 2000
bridge_flow_ratio = 0.95
bridge_speed = 25
brim_width = 0
clip_multipart_objects = 1
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_RAISE3D.*/ and printer_notes=~/.*PRINTER_MODEL_PRO2PLUS_HS.*/ and printer_notes=~/.*PRINTER_VARIANT_LEFT.*/ and nozzle_diameter[0]==0.4
complete_objects = 0
default_acceleration = 2000
dont_support_bridges = 1
elefant_foot_compensation = 0.15
ensure_vertical_shell_thickness = 1
external_perimeter_extrusion_width = 0.45
external_perimeter_speed = 40
external_perimeters_first = 0
extra_perimeters = 0
extrusion_width = 0.45
fill_angle = 45
fill_density = 15%
fill_pattern = gyroid
first_layer_acceleration = 1000
first_layer_extrusion_width = 0.48
first_layer_height = 0.3
first_layer_speed = 15
gap_fill_speed = 20
gcode_comments = 1
gcode_label_objects = 0
infill_acceleration = 2000
infill_every_layers = 1
infill_extruder = 1
infill_extrusion_width = 0.45
infill_overlap = 25%
infill_speed = 50
max_print_speed = 75
max_volumetric_speed = 0
min_skirt_length = 4
notes = EXPERIMENTAL conservative L1 profile. Not production-ready. Speeds capped below ideaMaker Hyper Speed PLA output until Stage 4 calibration.
only_retract_when_crossing_perimeters = 0
ooze_prevention = 0
output_filename_format = {input_filename_base}_{printer_model}_{layer_height}mm_{filament_type[0]}.gcode
overhangs = 1
perimeter_acceleration = 2000
perimeter_extruder = 1
perimeter_extrusion_width = 0.45
perimeter_speed = 45
perimeters = 3
post_process =
raft_layers = 0
resolution = 0
seam_position = aligned
skirts = 1
skirt_distance = 6
skirt_height = 1
small_perimeter_speed = 25
solid_infill_below_area = 0
solid_infill_every_layers = 0
solid_infill_extruder = 1
solid_infill_extrusion_width = 0.45
solid_infill_speed = 40
spiral_vase = 0
support_material = 0
support_material_extruder = 1
support_material_interface_extruder = 1
thin_walls = 1
top_fill_pattern = monotonic
top_infill_extrusion_width = 0.4
top_solid_infill_speed = 30
top_solid_layers = 5
travel_speed = 150
wipe_tower = 0
xy_size_compensation = 0

[print:0.20mm L1 Conservative @Raise3D Pro2 Plus HS Left]
inherits = *common*
layer_height = 0.2
alias = 0.20mm L1 Conservative

[filament:*common*]
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_RAISE3D.*/ and printer_notes=~/.*PRINTER_MODEL_PRO2PLUS_HS.*/ and printer_notes=~/.*PRINTER_VARIANT_LEFT.*/
cooling = 1
end_filament_gcode = "; Filament-specific end gcode"
extrusion_multiplier = 1
filament_cost = 20
filament_density = 1.24
filament_diameter = 1.75
filament_soluble = 0
filament_spool_weight = 1000
min_print_speed = 10
slowdown_below_layer_time = 15

[filament:Overture PLA @Raise3D Pro2 Plus HS Left]
inherits = *common*
alias = Overture PLA
bed_temperature = 60
bridge_fan_speed = 100
disable_fan_first_layers = 1
fan_always_on = 1
fan_below_layer_time = 60
filament_colour = #FF6A13
filament_max_volumetric_speed = 8
filament_notes = "EXPERIMENTAL. Filament Name #1 in start G-code is 'Overture PLA' and must match the name loaded on the printer. ideaMaker reference used [Raise3D] PLA at 230C/94% flow; those values were NOT copied. Temps and flow require Stage 4 testing. Copperhead-capable temps are not a reason to run Hyper Speed PLA settings."
filament_type = PLA
filament_vendor = Overture
first_layer_bed_temperature = 60
first_layer_temperature = 205
full_fan_speed_layer = 2
max_fan_speed = 100
min_fan_speed = 80
start_filament_gcode = ;Filament Diameter #1: {filament_diameter[0]}\n;Filament Compensation #1: {extrusion_multiplier[0]*100}\n;Filament Density #1: {filament_density[0]*1000}\n;Filament Type #1: {filament_type[0]}\n;Filament Name #1: Overture PLA\n;Filament #1: Overture PLA 1.75mm\nM221 T0 S{extrusion_multiplier[0]*100}
temperature = 200