# Raise3D Pro2 Plus Hyper Speed - experimental PrusaSlicer vendor bundle
# NOT production-ready. 0.4 mm Dual (T0+T1); unused tools skipped via is_extruder_used.
# Print family follows Prusa XL IS 0.4 (SPEED/STRUCTURAL/DETAIL/DRAFT), motion clipped to Hyper FFF L1.
# Left-only purge from conradfreeman_filament_orange.gcode; dual start/tool-change/end from Multicolor.gcode.
# Community 2022 Marlin Pro2 bundles are not the source of start/end G-code.

[vendor]
repo_id = non-prusa-fff
name = Raise3D (experimental)
config_version = 0.5.10

[printer_model:PRO2PLUS_HS_DUAL]
name = Raise3D Pro2 Plus Hyper Speed Dual (experimental)
variants = 0.4
technology = FFF
family = Pro2
default_materials = Generic PLA @Raise3D Pro2 Plus HS
bed_texture = PRO2PLUS_HS_DUAL_texture.svg

[printer:*common*]
printer_technology = FFF
autoemit_temperature_commands = 0
