[printer:Raise3D Pro2 Plus Hyper Speed 0.4 Dual]
inherits = *common*
printer_model = PRO2PLUS_HS_DUAL
printer_variant = 0.4
bed_shape = 0x0,305x0,305x305,0x305
max_print_height = 605
nozzle_diameter = 0.4,0.4
extruder_colour = #FF8000;#00B0E0
extruder_offset = 0x0,0x0
max_layer_height = 0.32,0.32
min_layer_height = 0.08,0.08
deretract_speed = 40,40
retract_before_travel = 1,1
retract_before_wipe = 0%,0%
retract_layer_change = 1,1
retract_length = 1.5,1.5
retract_length_toolchange = 11,11
retract_lift = 0,0
retract_lift_above = 0,0
retract_lift_below = 0,0
retract_restart_extra = 0,0
retract_restart_extra_toolchange = 0,0
retract_speed = 40,40
wipe = 1,1
default_filament_profile = "Generic PLA @Raise3D Pro2 Plus HS";"Generic PLA @Raise3D Pro2 Plus HS"
default_print_profile = 0.20mm SPEED @Raise3D Pro2 Plus HS
printer_notes = Don't remove the following keywords! These keywords are used in the compatible printer condition of the print and filament profiles.\nPRINTER_VENDOR_RAISE3D\nPRINTER_MODEL_PRO2PLUS_HS\nPRINTER_VARIANT_DUAL\nEXPERIMENTAL\nNot production-ready. Hyper Speed / Klipper Pro2 Plus dual electronic-lift heads.\nLeft-only purge from ideaMaker conradfreeman_filament_orange.gcode. Dual start, standby tool-change, and end from Multicolor.gcode. XY nozzle offset is firmware (factory ~25 mm X) — slicer offset is 0 so it is not applied twice. PrusaSlicer 2.9.6 has no per-tool printable area; the bed texture marks the leftmost 25 mm as T1 keep-out. Default wipe tower is X50 Y140 (past that band; drag on the plater). Stage 6-7 physical tests still required.
start_gcode = M99123 \n; EXPERIMENTAL PrusaSlicer dual profile - not production-ready\n; Dual start/tool-change from ideaMaker Multicolor.gcode; left-only purge from conradfreeman_filament_orange.gcode\n;Dimension: 305.000 305.000 605.000 0.400 0.400\n;Plate Shape: 0\n;Origin Center: 0\n;Extruder Offset #1: 0.000 0.000\n;Printer Type: RAISE3D Pro2 Plus - Hyper Speed\n;Firmware: Klipper\n;Filament Diameter #1: {filament_diameter[0]}\n;Filament Diameter #2: {filament_diameter[1]}\n;Filament Compensation #1: {extrusion_multiplier[0]*100}\n;Filament Compensation #2: {extrusion_multiplier[1]*100}\n;Filament Density #1: {filament_density[0]*1000}\n;Filament Density #2: {filament_density[1]*1000}\n;Filament Type #1: {filament_type[0]}\n;Filament Type #2: {filament_type[1]}\n;Filament Name #1: [Raise3D] PLA\n;Filament Name #2: [Raise3D] PLA\n;Filament #1: PLA 1.75mm\n;Filament #2: PLA 1.75mm\n{if is_extruder_used[0]}M221 T0 S{extrusion_multiplier[0]*100}\nM104 T0 S{first_layer_temperature[0]}\n{endif}\n{if is_extruder_used[1]}M221 T1 S{extrusion_multiplier[1]*100}\nM104 T1 S{first_layer_temperature[1]}\n{endif}\nM140 S{first_layer_bed_temperature[0]}\n{if is_extruder_used[0]}M109 T0 S{first_layer_temperature[0]}\n{endif}\n{if is_extruder_used[1]}M109 T1 S{first_layer_temperature[1]}\n{endif}\nT0\nM190 S{first_layer_bed_temperature[0]}\nG21\nG90\nM83\nM107\nG28 X0 Y0\nG28 Z0\nG1 Z15.0 F300\n{if is_extruder_used[0] && is_extruder_used[1] && initial_extruder == 0}\nT1\nG92 E0\nG1 F200 E10\nG92 E0\nG1 F200 E-11.00\nT0\nG92 E0\nG1 F200 E10\nG92 E0\n{elsif is_extruder_used[0] && is_extruder_used[1]}\nT0\nG92 E0\nG1 F200 E10\nG92 E0\nG1 F200 E-11.00\nT1\nG92 E0\nG1 F200 E10\nG92 E0\n{elsif is_extruder_used[0]}\nT0\nG92 E0\nG1 F140 E29\nG1 X20 Y0 F140 E1\nG92 E0\n{else}\nT1\nG92 E0\nG1 F200 E10\nG92 E0\n{endif}\n{if initial_extruder == 0}T0\n{else}T1\n{endif}\nG1 F9000.0\nM117 Printing...\nM1001\nSET_VELOCITY_LIMIT ACCEL=5000.00\nSET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10.00\n{if is_extruder_used[0] && is_extruder_used[1] && initial_extruder == 0}\nM104 T1 S180\n{elsif is_extruder_used[0] && is_extruder_used[1]}\nM104 T0 S180\n{endif}
end_gcode = M221 T0 S100\nM221 T1 S100\nG92 E0\nM1002\nM221 T0 S100\nM221 T1 S100\nM104 T0 S0\nM104 T1 S0\nM140 S0\nM107\nG91\nG1 E-1 F300\nG1 Z+0.5 E-5 X-20 Y-20 F9000.0\nG28 X0 Y0\nM84\nG90
toolchange_gcode = ; Raise3D electronic lift: firmware raises the unused nozzle. Do not emit M218.\n; Standby 180 C from ideaMaker Multicolor.gcode. Do not hardcode wipe-tower XY — PrusaSlicer places the tower.\n; previous_extruder is -1 on the first change.\n; Mid-print next-tool M104 is inserted by ensure_m99123_first.py (next_extruder is not available in layer G-code).\n{if previous_extruder == 0}\nM104 T0 S180\n{elsif previous_extruder == 1}\nM104 T1 S180\n{endif}\nM109 T{next_extruder} S{temperature[next_extruder]}

